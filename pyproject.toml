[project]
name = "audio-character-detector"
version = "1.0.0"
description = "Local web application for speaker diarization, gender/age classification, and character audio clip extraction."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "numpy>=1.26.4,<2.0.0",
    "scipy>=1.13.0",
    "soundfile>=0.12.1",
    "torch>=2.4.0,<2.8.0",
    "torchaudio>=2.4.0,<2.8.0",
    "pyannote.audio>=3.3.2,<4.0.0",
    "huggingface-hub>=0.24.0,<1.0.0",
    "transformers>=4.44.0,<5.0.0",
    "scikit-learn>=1.5.0",
    "speechbrain>=1.0.2",
    "silero-vad>=5.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
